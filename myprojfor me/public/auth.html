<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focusly — Login / Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">
        <span class="auth-brand-icon">🌸</span>
        <h1 class="auth-brand-title">Focusly</h1>
        <p class="auth-brand-subtitle">Your cozy corner to get things done, one session at a time</p>
      </div>

      <!-- TABS: Login / Sign Up -->
      <div class="auth-tabs">
        <button id="loginTabBtn" class="auth-tab active" data-tab="login">Log In</button>
        <button id="signupTabBtn" class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- ERROR MESSAGE -->
      <p id="authError" class="auth-error hidden"></p>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <label class="auth-field">
          <span class="auth-field-label">Email</span>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </label>
        <label class="auth-field">
          <span class="auth-field-label">Password</span>
          <div class="auth-password-wrapper">
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <button type="button" class="auth-eye-btn" data-target="loginPassword">
              <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line class="eye-strike" x1="2" y1="21" x2="22" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </label>
        <button type="submit" class="auth-submit-btn">Log In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form hidden">
        <label class="auth-field">
          <span class="auth-field-label">Username</span>
          <input type="text" id="signupUsername" placeholder="Eshaal" required>
        </label>
        <label class="auth-field">
          <span class="auth-field-label">Email</span>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </label>
        <label class="auth-field">
          <span class="auth-field-label">Password</span>
          <div class="auth-password-wrapper">
            <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6">
            <button type="button" class="auth-eye-btn" data-target="signupPassword">
              <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line class="eye-strike" x1="2" y1="21" x2="22" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </label>
        <button type="submit" class="auth-submit-btn">Create Account</button>
      </form>

      <p class="auth-switch-text">
        <span id="loginSwitchText">New here? <a href="#" id="goToSignup">Create an account</a></span>
        <span id="signupSwitchText" class="hidden">Already have an account? <a href="#" id="goToLogin">Log in</a></span>
      </p>

    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
